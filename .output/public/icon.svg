<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#3B82F6"/>
  
  <!-- Calendar icon -->
  <g transform="translate(100, 120)">
    <!-- Calendar body -->
    <rect x="20" y="40" width="160" height="180" rx="12" fill="white" stroke="white" stroke-width="4"/>
    
    <!-- Calendar header -->
    <rect x="20" y="40" width="160" height="50" rx="12" fill="#8B5CF6"/>
    <rect x="20" y="65" width="160" height="25" fill="#8B5CF6"/>
    
    <!-- Calendar binding rings -->
    <rect x="50" y="25" width="12" height="30" rx="6" fill="white"/>
    <rect x="138" y="25" width="12" height="30" rx="6" fill="white"/>
    
    <!-- Calendar grid dots -->
    <circle cx="50" cy="120" r="8" fill="#3B82F6"/>
    <circle cx="100" cy="120" r="8" fill="#3B82F6"/>
    <circle cx="150" cy="120" r="8" fill="#3B82F6"/>
    
    <circle cx="50" cy="155" r="8" fill="#3B82F6"/>
    <circle cx="100" cy="155" r="8" fill="#3B82F6"/>
    <circle cx="150" cy="155" r="8" fill="#3B82F6"/>
    
    <circle cx="50" cy="190" r="8" fill="#3B82F6"/>
    <circle cx="100" cy="190" r="8" fill="#F97316"/>
    <circle cx="150" cy="190" r="8" fill="#3B82F6"/>
  </g>
  
  <!-- Chat bubble -->
  <g transform="translate(240, 240)">
    <!-- Bubble body -->
    <rect x="20" y="20" width="140" height="100" rx="20" fill="white"/>
    
    <!-- Bubble tail -->
    <path d="M 30 120 L 20 140 L 50 120 Z" fill="white"/>
    
    <!-- Chat dots -->
    <circle cx="50" cy="70" r="12" fill="#8B5CF6"/>
    <circle cx="90" cy="70" r="12" fill="#8B5CF6"/>
    <circle cx="130" cy="70" r="12" fill="#8B5CF6"/>
  </g>
</svg>
